# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Gale's Top Trading Cycles (Shapley-Scarf Housing Market)"
  description: >-
    A Lean formalization of Gale's top trading cycles algorithm (1974) for the
    Shapley-Scarf housing market. Finitely many agents (Fin n) each own exactly
    one house (the endowment is a bijection endow : Fin n ≃ Fin n) and have
    strict preferences over houses, given most-preferred-first as per-agent
    permutations rank i : Fin n ≃ Fin n; agent i strictly prefers house a over
    house b iff (rank i).symm a < (rank i).symm b. The formal results are
    TTC.Palomar.ttcTerminates: the TTC procedure (each remaining agent points
    to the owner of their favourite remaining house, each house points to its
    owner, agents in directed cycles trade and leave) removes every agent
    within n rounds, since each round deletes at least one nonempty directed
    cycle from the finite functional pointing graph;
    TTC.Palomar.ttcInCore: the TTC allocation is in the core, i.e. no
    coalition S can reallocate its own endowments (Set.BijOn y S (M.endow ''
    S)) so that every member strictly prefers the deviation;
    TTC.Palomar.ttcUniqueCore: the core is a singleton, so the TTC allocation
    is the unique core allocation (Roth-Postlewaite 1977). The library also
    proves the TTC allocation Pareto optimal (a Pareto improvement by the
    grand coalition would block), individually rational (each agent's TTC
    house is weakly preferred to their endowment, since their own house is
    always available until they trade), and strategyproof (Roth 1982: no
    agent gains by misreporting preferences). The Palomar registry API was
    searched on 2026-10-01 for "housing market top trading cycles TTC" and
    returned no existing TTC formalization among 395 entries; this is a dated,
    limited observation, not a universal prior-art claim, and will be
    re-verified at packaging time.
  authors: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  responsible_maintainers: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  license: "BSD-3-Clause"

