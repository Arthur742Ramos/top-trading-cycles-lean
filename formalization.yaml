automation:
  methods:
    - method: "agent"
      models: ["GPT-6.1 via Codex"]
      framework: "Lean 4 v4.35.0-rc2 and Mathlib v4.35.0-rc2"

status:
  scope: >-
    Completed 2026-10-01: full TTC arc done. M1 core definitions (HousingMarket,
    TTC algorithm, ttcAllocation, Core, StrictCore, ParetoOptimal,
    IndividuallyRational, Strategyproof); M2 algorithm with round lemmas;
    M3 termination (ttcIter_univ_empty) and ordinary core membership
    (ttcInCore); M4 strict-core uniqueness (ttcUniqueStrictCore) and strict-core
    membership (ttcInStrictCore); M5 Pareto optimality (ttcPareto), individual
    rationality (ttcIR), and strategyproofness (ttcStrategyproof, Roth 1982);
    M6 Challenge/Solution packaging with the three-theorem comparator surface
    (ttcTerminates, ttcInCore, ttcUniqueStrictCore); M7 full local verification
    replica plus the official lake comparator stage, all green. Library builds
    with zero sorries; all theorems depend only on propext, Classical.choice,
    and Quot.sound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

alignment:
  namespace: "TTC.Palomar"
  statements:
    - source: "Shapley-Scarf housing market"
      lean: "TTC.HousingMarket"
      module: "TTC/Defs.lean"
      status: "defined"
      note: "Endowment endow : Fin n ≃ Fin n plus strict per-agent rankings rank i : Fin n ≃ Fin n, most-preferred-first."
    - source: "TTC algorithm and allocation"
      lean: "TTC.ttcAllocation"
      module: "TTC/Algorithm.lean"
      status: "defined"
      note: "Iterates ttcRound (point to the owner of the favourite remaining house; agents in directed cycles trade and leave) n times from Finset.univ."
    - source: "TTC terminates"
      lean: "TTC.Palomar.ttcTerminates"
      module: "Challenge.lean"
      status: "proven"
      note: "Binders {n : Nat} (M : HousingMarket n); concludes (ttcIter M n Finset.univ id).1 = ∅."
    - source: "TTC allocation is in the core"
      lean: "TTC.Palomar.ttcInCore"
      module: "Challenge.lean"
      status: "proven"
      note: "Binders {n : Nat} (M : HousingMarket n); concludes Core M (ttcAllocation M): no coalition can make every member strictly better off with its own endowments."
    - source: "Strict-core uniqueness"
      lean: "TTC.Palomar.ttcUniqueStrictCore"
      module: "Challenge.lean"
      status: "proven"
      note: "Binders {n : Nat} (M : HousingMarket n) (x : Fin n → Fin n) (hxb : Function.Bijective x) (hx : StrictCore M x); concludes x = ttcAllocation M. Uniqueness among bijective strict-core allocations, not a singleton claim about the ordinary core."
    - source: "Strategyproofness (library-only, not on the comparator surface)"
      lean: "TTC.ttcStrategyproof"
      module: "TTC/Strategyproof.lean"
      status: "proven"
      note: "Binders (n : Nat) (w : Fin n ≃ Fin n); concludes Strategyproof n w: for every profile r, agent i, and misreport rNew, prefLE (HousingMarket.mk w r) i (x i) (xNew i) where x is the truthful TTC outcome and xNew the unilateral-misreport outcome."
